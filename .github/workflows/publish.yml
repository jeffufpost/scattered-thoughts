# Renders the blog and publishes it to the gh-pages branch on every push to main,
# so posts can be added or edited directly on github.com.
# Notebooks are not executed: commit them with their outputs saved.
name: Publish blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jupyter

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
